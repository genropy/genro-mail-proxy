# Full-stack integration testing infrastructure
#
# This compose provides the EXTERNAL INFRASTRUCTURE for fullstack tests:
# - Database (PostgreSQL)
# - SMTP servers (MailHog for capturing emails)
# - S3 storage (MinIO)
# - IMAP server (Dovecot for bounce testing)
# - Error-simulating SMTP servers
# - Programmable fake clients (the outbound protocol, one per tenant)
#
# The mailproxy service itself runs LOCALLY (not in Docker).
# This allows testing against current code without rebuilding containers.
#
# Usage:
#   1. Start infrastructure: docker compose -f docker-compose.fulltest.yml up -d
#   2. Start mailproxy locally:
#      GMP_DB_PATH=postgresql://mailproxy:testpassword@localhost:5433/mailproxy \
#      GMP_API_TOKEN=test-api-token \
#      uvicorn mail_proxy.server:app --host 0.0.0.0 --port 8000
#   3. Run tests: pytest tests/fullstack/
#   4. For bounce tests: docker compose --profile bounce up -d
#
# Every published port is overridable through a GMP_TEST_* variable, so the stack
# can run beside another one holding the default ports. The same variables drive
# tests/fullstack/helpers.py; unset, they reproduce the ports listed below.
#
#   GMP_TEST_DB_PORT             5433   GMP_TEST_MAILHOG1_SMTP_PORT   1025
#   GMP_TEST_MINIO_PORT          9000   GMP_TEST_MAILHOG1_API_PORT    8025
#   GMP_TEST_MINIO_CONSOLE_PORT  9001   GMP_TEST_MAILHOG2_SMTP_PORT   1026
#   GMP_TEST_CLIENT1_PORT        8081   GMP_TEST_MAILHOG2_API_PORT    8026
#   GMP_TEST_CLIENT2_PORT        8082   GMP_TEST_SMTP_REJECT_PORT     1027
#   GMP_TEST_ATTACHMENTS_PORT    8083   GMP_TEST_SMTP_TEMPFAIL_PORT   1028
#   GMP_TEST_DOVECOT_IMAP_PORT  10143   GMP_TEST_SMTP_TIMEOUT_PORT    1029
#   GMP_TEST_MAILPROXY_PORT      8000   GMP_TEST_SMTP_RATELIMIT_PORT  1030
#   GMP_TEST_HOST           localhost   GMP_TEST_SMTP_RANDOM_PORT     1031
#
# GMP_TEST_MAILPROXY_PORT and GMP_TEST_HOST are read by the tests only: the
# mailproxy runs locally, outside this compose.
#
# Note: PostgreSQL uses port 5433 (not 5432) to avoid conflicts with local postgres

services:
  # ============================================
  # DATABASE
  # ============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailproxy
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: mailproxy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${GMP_TEST_DB_PORT:-5433}:5432"  # 5433 avoids the local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailproxy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - testnet

  # ============================================
  # OBJECT STORAGE (S3-compatible)
  # ============================================
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "${GMP_TEST_MINIO_PORT:-9000}:9000"   # S3 API
      - "${GMP_TEST_MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - testnet

  # MinIO initial setup (create bucket)
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/mail-attachments --ignore-existing;
        mc anonymous set download local/mail-attachments;
        echo 'MinIO setup complete';
      "
    networks:
      - testnet

  # ============================================
  # SMTP SERVERS (MailHog)
  # ============================================
  mailhog-tenant1:
    image: mailhog/mailhog:latest
    # MailHog's RSS tracks the bytes it has EVER received: clearing the mailbox
    # returns nothing (measured, 2.1 GiB before and after a DELETE), so one full
    # suite run takes tenant1 from 16 MiB to 1.56 GiB. The session fixture
    # restarts these two services to reset that; the cap and the policy are the
    # containment for a run that grows past it, so a spike kills MailHog alone
    # instead of the largest process on the Docker VM.
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "${GMP_TEST_MAILHOG1_SMTP_PORT:-1025}:1025"   # SMTP
      - "${GMP_TEST_MAILHOG1_API_PORT:-8025}:8025"   # Web UI / API
    networks:
      - testnet

  mailhog-tenant2:
    image: mailhog/mailhog:latest
    # Bounded for the same reason as tenant1, above.
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "${GMP_TEST_MAILHOG2_SMTP_PORT:-1026}:1025"   # SMTP
      - "${GMP_TEST_MAILHOG2_API_PORT:-8026}:8025"   # Web UI / API
    networks:
      - testnet

  # ============================================
  # ERROR-SIMULATING SMTP SERVERS
  # ============================================

  # Rejects all emails (550 permanent error)
  smtp-reject:
    build:
      context: ./error-smtp
    ports:
      - "${GMP_TEST_SMTP_REJECT_PORT:-1027}:1025"
    environment:
      - SMTP_ERROR_MODE=reject_all
    networks:
      - testnet

  # Temporary failures (451) - triggers retry
  smtp-tempfail:
    build:
      context: ./error-smtp
    ports:
      - "${GMP_TEST_SMTP_TEMPFAIL_PORT:-1028}:1025"
    environment:
      - SMTP_ERROR_MODE=temp_fail
    networks:
      - testnet

  # Slow responses (simulates timeout)
  smtp-timeout:
    build:
      context: ./error-smtp
    ports:
      - "${GMP_TEST_SMTP_TIMEOUT_PORT:-1029}:1025"
    environment:
      - SMTP_ERROR_MODE=timeout
      - SMTP_TIMEOUT_SECONDS=30
    networks:
      - testnet

  # Rate limiting (accepts first N, then rejects)
  smtp-ratelimit:
    build:
      context: ./error-smtp
    ports:
      - "${GMP_TEST_SMTP_RATELIMIT_PORT:-1030}:1025"
    environment:
      - SMTP_ERROR_MODE=rate_limit
      - SMTP_RATE_LIMIT=3
    networks:
      - testnet

  # Random errors (mix of success/failure)
  smtp-random:
    build:
      context: ./error-smtp
    ports:
      - "${GMP_TEST_SMTP_RANDOM_PORT:-1031}:1025"
    environment:
      - SMTP_ERROR_MODE=random
    networks:
      - testnet

  # ============================================
  # IMAP SERVER (for bounce detection testing)
  # Only started with: docker compose --profile bounce up -d
  # ============================================
  dovecot:
    image: dovecot/dovecot:2.4.0
    platform: linux/arm64
    user: root
    profiles:
      - bounce
    ports:
      - "${GMP_TEST_DOVECOT_IMAP_PORT:-10143}:31143"
    volumes:
      - ./dovecot/etc:/etc/dovecot:ro
      - dovecot-mail:/srv/vmail
    healthcheck:
      test: ["CMD-SHELL", "doveadm auth test bounces@localhost bouncepass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - testnet

  # ============================================
  # CLIENT ENDPOINTS (programmable fake Genropy clients)
  # ============================================
  # Serve the outbound protocol (proxy_sync, proxy_get_attachments) answering
  # what each test programmed, and a control surface the tests drive.
  # See programmable-client/server.py.
  client-tenant1:
    build:
      context: ./programmable-client
    ports:
      - "${GMP_TEST_CLIENT1_PORT:-8081}:8080"
    networks:
      - testnet

  client-tenant2:
    build:
      context: ./programmable-client
    ports:
      - "${GMP_TEST_CLIENT2_PORT:-8082}:8080"
    networks:
      - testnet

  # ============================================
  # ATTACHMENT SERVER (HTTP endpoint for remote attachments)
  # ============================================
  attachment-server:
    image: python:3.11-slim
    working_dir: /data
    command: python -m http.server 8080
    volumes:
      - ./test-attachments:/data:ro
    ports:
      - "${GMP_TEST_ATTACHMENTS_PORT:-8083}:8080"
    networks:
      - testnet

networks:
  testnet:
    driver: bridge

volumes:
  pgdata:
  minio-data:
  dovecot-mail:
