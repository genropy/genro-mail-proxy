# The one pytest configuration of this project. pytest.ini wins over
# [tool.pytest.ini_options] in pyproject.toml, so nothing is configured there.
[pytest]
pythonpath = .
asyncio_default_fixture_loop_scope = function
markers =
    fullstack: marks tests as fullstack integration tests (deselect with '-m "not fullstack"')
    bounce_e2e: marks tests as bounce end-to-end tests requiring Dovecot IMAP
    chaos: marks tests with non-deterministic/random behavior
    retention: marks tests for message retention and cleanup features
    rate_limit: marks tests for account-level rate limiting
    pec: marks PEC receipt tests, deselected by default (run them with '-m pec')
addopts = -m "not pec"
